name: Turso check

# Valida a conexão e o protocolo com o Turso usando os segredos do repositório (sem expô-los).
# LEGADO (era Pulso): os segredos TURSO_* do repositório apontam para o banco antigo e a checagem estourava o tempo em todo push.
# Agora só roda manualmente (workflow_dispatch). O banco atual do CORVO é conferido pela rota /api/admin/turso-ping do Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conectar ao Turso
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python engine/scripts/turso_check.py
