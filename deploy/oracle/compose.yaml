# CORVO num servidor (ex.: Oracle A1): roda a coleta a cada 10 minutos. NÃO é ligado ainda: só sobe quando o dono mandar (ver docs/corvo/IMPLANTACAO.md).
# Uso:  cd deploy/oracle && cp .env.example .env && docker compose up -d --build
services:
  coletor:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    command: ["python", "-m", "corvo_engine.collect", "--interval", "600", "--state", "/state/seen.sqlite"]
    restart: always
    env_file: .env # CORVO_API_URL e CORVO_INGEST_TOKEN; nunca vão para o Git
    volumes:
      - corvo-state:/state
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  corvo-state:
